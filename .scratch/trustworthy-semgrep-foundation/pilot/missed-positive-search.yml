rules:
  - id: exploratory-sql-percent-or-concatenation
    languages: [python]
    severity: INFO
    message: Formatted SQL outside the pilot rule's f-string/format coverage.
    pattern-either:
      - pattern: frappe.db.sql("..." % ..., ...)
      - pattern: frappe.db.sql("..." + $VALUE, ...)
      - pattern: |
          $QUERY = "..." % ...
          ...
          frappe.db.sql($QUERY, ...)
      - pattern: |
          $QUERY = "..." + $VALUE
          ...
          frappe.db.sql($QUERY, ...)

  - id: exploratory-whitelisted-raw-sql
    languages: [python]
    severity: INFO
    message: Whitelisted raw SQL is outside the permission-bypass rule's operation set.
    patterns:
      - pattern-inside: |
          @frappe.whitelist(...)
          def $FUNC(...):
            ...
      - pattern: frappe.db.sql(...)

  - id: exploratory-read-in-comprehension
    languages: [python]
    severity: INFO
    message: Frappe database read in a comprehension outside statement-loop matching.
    pattern-either:
      - pattern: "[frappe.db.get_value(...) for $ITEM in $ITERABLE]"
      - pattern: "[frappe.get_doc(...) for $ITEM in $ITERABLE]"
      - pattern: "{frappe.db.get_value(...) for $ITEM in $ITERABLE}"
      - pattern: "{frappe.get_doc(...) for $ITEM in $ITERABLE}"
      - pattern: "{...: frappe.db.get_value(...) for $ITEM in $ITERABLE}"
      - pattern: "{...: frappe.get_doc(...) for $ITEM in $ITERABLE}"
