rules:
  - id: frappe-n-plus-one-read-in-comprehension
    languages: [python]
    severity: WARNING
    message: >-
      A Frappe database read may repeat in a comprehension result or filter. Fetch the
      required values in bulk and index them in memory, or document why the
      iterable is deliberately bounded. Runtime query evidence is required
      before treating this advisory as a performance regression.
    metadata:
      origin: custom
      category: performance
      confidence: MEDIUM
      technology: [frappe]
    # Keep the read structurally inside the result/key/filter expression.
    # Neither the outer iterable nor an enclosing bulk query repeats per item.
    # CE matches clause lists exactly: cover one/two generators and a trailing
    # filter. Deeper nesting or filters between generators need separate cases.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: "[<... $READ(...) ...> for $ITEM in $ITERABLE]"
                  - pattern: "[<... $READ(...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE]"
                  - pattern: "[<... $READ(...) ...> for $ITEM in $ITERABLE if ...]"
                  - pattern: "[<... $READ(...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...]"
                  - pattern: "{<... $READ(...) ...> for $ITEM in $ITERABLE}"
                  - pattern: "{<... $READ(...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE}"
                  - pattern: "{<... $READ(...) ...> for $ITEM in $ITERABLE if ...}"
                  - pattern: "{<... $READ(...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...}"
                  - pattern: "(<... $READ(...) ...> for $ITEM in $ITERABLE)"
                  - pattern: "(<... $READ(...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE)"
                  - pattern: "(<... $READ(...) ...> for $ITEM in $ITERABLE if ...)"
                  - pattern: "(<... $READ(...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...)"
                  - pattern: "{$KEY: <... $READ(...) ...> for $ITEM in $ITERABLE}"
                  - pattern: "{$KEY: <... $READ(...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE}"
                  - pattern: "{$KEY: <... $READ(...) ...> for $ITEM in $ITERABLE if ...}"
                  - pattern: "{$KEY: <... $READ(...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...}"
                  - pattern: "{<... $READ(...) ...>: $VALUE for $ITEM in $ITERABLE}"
                  - pattern: "{<... $READ(...) ...>: $VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE}"
                  - pattern: "{<... $READ(...) ...>: $VALUE for $ITEM in $ITERABLE if ...}"
                  - pattern: "{<... $READ(...) ...>: $VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...}"
                  - pattern: "[$VALUE for $ITEM in $ITERABLE if <... $READ(...) ...>]"
                  - pattern: "[$VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if <... $READ(...) ...>]"
                  - pattern: "{$VALUE for $ITEM in $ITERABLE if <... $READ(...) ...>}"
                  - pattern: "{$VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if <... $READ(...) ...>}"
                  - pattern: "($VALUE for $ITEM in $ITERABLE if <... $READ(...) ...>)"
                  - pattern: "($VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if <... $READ(...) ...>)"
                  - pattern: "{$KEY: $VALUE for $ITEM in $ITERABLE if <... $READ(...) ...>}"
                  - pattern: "{$KEY: $VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if <... $READ(...) ...>}"
              - metavariable-regex:
                  metavariable: $READ
                  regex: ^frappe\.(get_all|get_list|get_single|db\.(get_value|get_values|get_single_value|get_list|get_all|exists|count|sql))$
          - patterns:
              - pattern-either:
                  - pattern: "[<... $READ($DOCTYPE, $NAME, ...) ...> for $ITEM in $ITERABLE]"
                  - pattern: "[<... $READ($DOCTYPE, $NAME, ...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE]"
                  - pattern: "[<... $READ($DOCTYPE, $NAME, ...) ...> for $ITEM in $ITERABLE if ...]"
                  - pattern: "[<... $READ($DOCTYPE, $NAME, ...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...]"
                  - pattern: "{<... $READ($DOCTYPE, $NAME, ...) ...> for $ITEM in $ITERABLE}"
                  - pattern: "{<... $READ($DOCTYPE, $NAME, ...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE}"
                  - pattern: "{<... $READ($DOCTYPE, $NAME, ...) ...> for $ITEM in $ITERABLE if ...}"
                  - pattern: "{<... $READ($DOCTYPE, $NAME, ...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...}"
                  - pattern: "(<... $READ($DOCTYPE, $NAME, ...) ...> for $ITEM in $ITERABLE)"
                  - pattern: "(<... $READ($DOCTYPE, $NAME, ...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE)"
                  - pattern: "(<... $READ($DOCTYPE, $NAME, ...) ...> for $ITEM in $ITERABLE if ...)"
                  - pattern: "(<... $READ($DOCTYPE, $NAME, ...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...)"
                  - pattern: "{$KEY: <... $READ($DOCTYPE, $NAME, ...) ...> for $ITEM in $ITERABLE}"
                  - pattern: "{$KEY: <... $READ($DOCTYPE, $NAME, ...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE}"
                  - pattern: "{$KEY: <... $READ($DOCTYPE, $NAME, ...) ...> for $ITEM in $ITERABLE if ...}"
                  - pattern: "{$KEY: <... $READ($DOCTYPE, $NAME, ...) ...> for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...}"
                  - pattern: "{<... $READ($DOCTYPE, $NAME, ...) ...>: $VALUE for $ITEM in $ITERABLE}"
                  - pattern: "{<... $READ($DOCTYPE, $NAME, ...) ...>: $VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE}"
                  - pattern: "{<... $READ($DOCTYPE, $NAME, ...) ...>: $VALUE for $ITEM in $ITERABLE if ...}"
                  - pattern: "{<... $READ($DOCTYPE, $NAME, ...) ...>: $VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if ...}"
                  - pattern: "[$VALUE for $ITEM in $ITERABLE if <... $READ($DOCTYPE, $NAME, ...) ...>]"
                  - pattern: "[$VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if <... $READ($DOCTYPE, $NAME, ...) ...>]"
                  - pattern: "{$VALUE for $ITEM in $ITERABLE if <... $READ($DOCTYPE, $NAME, ...) ...>}"
                  - pattern: "{$VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if <... $READ($DOCTYPE, $NAME, ...) ...>}"
                  - pattern: "($VALUE for $ITEM in $ITERABLE if <... $READ($DOCTYPE, $NAME, ...) ...>)"
                  - pattern: "($VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if <... $READ($DOCTYPE, $NAME, ...) ...>)"
                  - pattern: "{$KEY: $VALUE for $ITEM in $ITERABLE if <... $READ($DOCTYPE, $NAME, ...) ...>}"
                  - pattern: "{$KEY: $VALUE for $GROUP in $GROUPS for $ITEM in $ITERABLE if <... $READ($DOCTYPE, $NAME, ...) ...>}"
              - metavariable-regex:
                  metavariable: $READ
                  regex: ^frappe\.get_doc$
      - focus-metavariable: $READ
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
        - "**/patches/**"

  - id: frappe-n-plus-one-read-in-loop
    languages: [python]
    severity: WARNING
    message: >-
      A Frappe database read call appears in a loop body. It may repeat per
      item, including in conditional checks. Review batching, guards and cache
      behaviour; confirm runtime query counts before treating this advisory as
      a performance defect.
    metadata:
      origin: custom
      category: performance
      confidence: MEDIUM
      technology: [frappe]
    # Nested negation keeps deferred bodies out without excluding outer functions.
    match:
      all:
        - inside:
            any:
              - pattern: |
                  for $ITEM in $ITERABLE:
                    $...BODY
                where:
                  - focus: $...BODY
              - pattern: |
                  while $CONDITION:
                    $...BODY
                where:
                  - focus: $...BODY
        - any:
            - pattern: $READ(...)
              where:
                - metavariable: $READ
                  regex: ^frappe\.(get_all|get_list|get_single|db\.(get_value|get_values|get_single_value|get_list|get_all|exists|count))$
            - pattern: $READ($QUERY, ...)
              where:
                - metavariable: $READ
                  regex: ^frappe\.db\.sql$
                - metavariable: $QUERY
                  regex: (?is)^(?![rubf]*(?:"""|'''|"|')?\s*(?:update|delete|insert|alter|drop|truncate|replace)\b).*$
            - any:
                - $READ($DOCTYPE, $NAME, ...)
                - $READ(doctype=$DOCTYPE, name=$NAME, ...)
              where:
                - metavariable: $READ
                  regex: ^frappe\.get_doc$
        - not:
            inside:
              all:
                - inside:
                    any:
                      - |
                          for $ITEM in $ITERABLE:
                            ...
                      - |
                          while $CONDITION:
                            ...
                - any:
                    - |
                        def $DEFERRED(...):
                          ...
                    - 'lambda $ARG: $EXPR'
                    - 'lambda: $EXPR'
      where:
        - focus: $READ
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
        - "**/patches/**"

  - id: frappe-get-all-then-get-doc
    languages: [python]
    severity: WARNING
    message: >-
      Names fetched by get_all/get_list are expanded with get_doc inside a loop.
      Fetch the needed fields or child rows in bulk and verify the query count.
    metadata:
      origin: custom
      category: performance
      confidence: HIGH
      technology: [frappe]
    patterns:
      - pattern-either:
          - pattern: |
              $NAMES = frappe.get_all(..., pluck="name", ...)
              ...
              for $NAME in $NAMES:
                ...
                frappe.get_doc(..., $NAME)
                ...
          - pattern: |
              $NAMES = frappe.get_list(..., pluck="name", ...)
              ...
              for $NAME in $NAMES:
                ...
                frappe.get_doc(..., $NAME)
                ...
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
        - "**/patches/**"

  - id: frappe-unbounded-list-query
    languages: [python]
    severity: WARNING
    message: >-
      This query explicitly disables Frappe's page-length bound. Use pagination
      or document why loading the complete result set is safe and bounded.
    metadata:
      origin: custom
      category: performance
      confidence: HIGH
      technology: [frappe]
    # In v16, an explicit limit wins; otherwise page_length can supply a bound.
    # Unknown limits are not evidence that the query is unbounded.
    patterns:
      - pattern: $GET(..., limit_page_length=0, ...)
      - metavariable-regex:
          metavariable: $GET
          regex: ^frappe\.(db\.)?get_(all|list)$
      - pattern-either:
          - pattern: $GET(..., limit=0, ...)
          - patterns:
              - pattern-either:
                  - pattern: $GET(..., limit=None, ...)
                  - patterns:
                      - pattern: $GET(...)
                      - pattern-not: $GET(..., limit=$LIMIT, ...)
              - pattern-either:
                  - pattern: $GET(..., page_length=0, ...)
                  - pattern: $GET(..., page_length=None, ...)
                  - patterns:
                      - pattern: $GET(...)
                      - pattern-not: $GET(..., page_length=$PAGE_LENGTH, ...)
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
        - "**/patches/**"

  - id: frappe-materialises-list-only-to-count
    languages: [python]
    severity: WARNING
    message: >-
      This materialises a Frappe result list only to count it. Use a count query
      with equivalent permission semantics when only the count is needed.
    metadata:
      origin: custom
      category: performance
      confidence: HIGH
      technology: [frappe]
    # Unknown or nonzero bounds stay outside this rule; zero is not a bound.
    patterns:
      - pattern: len($GET(...))
      - metavariable-regex:
          metavariable: $GET
          regex: ^frappe\.(db\.)?get_(all|list)$
      - pattern-either:
          - pattern: len($GET(..., limit=0, ...))
          - patterns:
              - pattern: len($GET(...))
              - pattern-not: len($GET(..., limit=$LIMIT, ...))
      - pattern-either:
          - pattern: len($GET(..., limit_page_length=0, ...))
          - patterns:
              - pattern: len($GET(...))
              - pattern-not: len($GET(..., limit_page_length=$LIMIT, ...))
      - pattern-either:
          - pattern: len($GET(..., page_length=0, ...))
          - patterns:
              - pattern: len($GET(...))
              - pattern-not: len($GET(..., page_length=$LIMIT, ...))
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
        - "**/patches/**"

  - id: frappe-database-write-in-loop
    languages: [python]
    severity: WARNING
    message: >-
      A Frappe database write runs inside a loop. Prefer a bulk update or a
      deliberately chunked operation, and verify transaction/query behaviour.
    metadata:
      origin: custom
      category: performance
      confidence: MEDIUM
      technology: [frappe]
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $ITEM in $ITERABLE:
                ...
          - pattern-inside: |
              while $CONDITION:
                ...
      - pattern-either:
          - pattern: frappe.db.set_value(...)
          - pattern: frappe.db.set_single_value(...)
          - pattern: frappe.db.delete(...)
          - pattern: frappe.delete_doc(...)
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
        - "**/patches/**"

  - id: frappe-enqueue-in-loop
    languages: [python]
    severity: WARNING
    message: >-
      A background job is enqueued once per loop item. Confirm bounded fan-out,
      deduplication, queue capacity, and enqueue-after-commit semantics.
    metadata:
      origin: custom
      category: performance
      confidence: MEDIUM
      technology: [frappe]
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $ITEM in $ITERABLE:
                ...
          - pattern-inside: |
              while $CONDITION:
                ...
      - pattern-either:
          - pattern: frappe.enqueue(...)
          - pattern: frappe.enqueue_doc(...)
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
        - "**/patches/**"

  - id: frappe-client-request-in-loop
    languages: [javascript]
    severity: WARNING
    message: >-
      A Frappe client request runs inside a loop. Batch the server operation or
      justify the bounded fan-out; serial await creates N network round trips.
    metadata:
      origin: custom
      category: performance
      confidence: MEDIUM
      technology: [frappe]
    patterns:
      - pattern-either:
          - pattern-inside: |
              for ($INIT; $CONDITION; $UPDATE) {
                ...
              }
          - pattern-inside: |
              for (const $ITEM of $ITERABLE) {
                ...
              }
          - pattern-inside: |
              for (const $KEY in $OBJECT) {
                ...
              }
          - pattern-inside: |
              while ($CONDITION) {
                ...
              }
          - pattern-inside: |
              do {
                ...
              } while ($CONDITION);
      - pattern-either:
          - pattern: frappe.call(...)
          - pattern: frappe.xcall(...)
          - pattern: frappe.db.get_value(...)
          - pattern: frappe.db.get_list(...)
          - pattern: frappe.db.get_doc(...)
          - pattern: frappe.db.exists(...)
          - pattern: frappe.db.count(...)
          - pattern: frm.call(...)
    paths:
      exclude:
        - "**/*.test.js"
        - "**/tests/**"

  - id: frappe-client-request-in-array-callback
    languages: [javascript]
    severity: WARNING
    message: >-
      A Frappe client request is issued once per array item. Prefer a batched
      server method or document why the request fan-out is bounded.
    metadata:
      origin: custom
      category: performance
      confidence: MEDIUM
      technology: [frappe]
    # Compare the nested function with the callback itself before excluding it.
    match:
      all:
        - inside: $ITEMS.$METHOD($CALLBACK, ...)
        - $REQUEST(...)
        - not:
            inside:
              all:
                - inside: $ITEMS.$METHOD($CALLBACK, ...)
                - any:
                    - pattern: (...) => $EXPR
                      as: $DEFERRED
                    - pattern: function (...) { ... }
                      as: $DEFERRED
                    - pattern: function $NAME(...) { ... }
                      as: $DEFERRED
              where:
                - comparison: str($DEFERRED) != str($CALLBACK)
      where:
        - metavariable: $METHOD
          regex: ^(forEach|map)$
        - metavariable: $REQUEST
          regex: ^(frappe\.(call|xcall|db\.(get_value|get_list|get_doc|exists|count))|frm\.call)$
        - focus: $REQUEST
    paths:
      exclude:
        - "**/*.test.js"
        - "**/tests/**"
