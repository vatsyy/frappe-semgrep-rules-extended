rules:
  - id: frappe-direct-python-eval-exec
    languages: [python]
    severity: WARNING
    message: >-
      Direct Python eval or exec executes code in the current process. Verify
      that the input is fixed or restricted to an explicit administrative
      boundary; prefer a parser such as ast.literal_eval for data.
    metadata:
      origin: custom
      category: security
      confidence: MEDIUM
      technology: [frappe]
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"

  - id: frappe-dynamic-template-with-default-globals
    languages: [python]
    severity: WARNING
    message: >-
      A dynamic template is rendered with Frappe's default globals. Verify who
      can edit the template and whether that trust boundary is intended; use a
      fixed template path or restrict_globals=True where compatible.
    metadata:
      origin: custom
      category: security
      confidence: MEDIUM
      technology: [frappe]
      cwe:
        - "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
    patterns:
      - pattern-either:
          - pattern: render_template($TEMPLATE, ...)
          - pattern: frappe.render_template($TEMPLATE, ...)
      - pattern-not: render_template($TEMPLATE, ..., restrict_globals=True, ...)
      - pattern-not: frappe.render_template($TEMPLATE, ..., restrict_globals=True, ...)
      - pattern-not: render_template($TEMPLATE, ..., restrict_globals=1, ...)
      - pattern-not: frappe.render_template($TEMPLATE, ..., restrict_globals=1, ...)
      - pattern-not: render_template($TEMPLATE, ..., is_path=True, ...)
      - pattern-not: frappe.render_template($TEMPLATE, ..., is_path=True, ...)
      # Exclude literal strings, not every expression beginning with a quote.
      - metavariable-pattern:
          metavariable: $TEMPLATE
          patterns:
            - pattern-not: '"..."'
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"

  - id: frappe-ignored-permission-result
    languages: [python]
    severity: ERROR
    message: >-
      The result of frappe.has_permission is ignored. Test or return the
      boolean, or pass throw=True when denial must raise an exception.
    metadata:
      origin: custom
      category: security
      confidence: HIGH
      technology: [frappe]
      cwe:
        - "CWE-862: Missing Authorization"
    # Only omitted or explicitly false throw values establish this warning.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: frappe.has_permission(...)
              - pattern-not: frappe.has_permission(..., throw=$THROW, ...)
              - pattern-not: frappe.has_permission($DOCTYPE, $PTYPE, $DOC, $USER, $THROW, ...)
          - pattern: frappe.has_permission(..., throw=False, ...)
          - pattern: frappe.has_permission(..., throw=0, ...)
          - pattern: frappe.has_permission(..., throw=None, ...)
          - pattern: frappe.has_permission($DOCTYPE, $PTYPE, $DOC, $USER, False, ...)
          - pattern: frappe.has_permission($DOCTYPE, $PTYPE, $DOC, $USER, 0, ...)
          - pattern: frappe.has_permission($DOCTYPE, $PTYPE, $DOC, $USER, None, ...)
      - pattern-not-inside: $VALUE = <... frappe.has_permission(...) ...>
      - pattern-not-inside: "return <... frappe.has_permission(...) ...>"
      - pattern-not-inside: "yield <... frappe.has_permission(...) ...>"
      - pattern-not-inside: "if <... frappe.has_permission(...) ...>: ..."
      - pattern-not-inside: "assert <... frappe.has_permission(...) ...>"
      - pattern-not-inside: "$TRUE if frappe.has_permission(...) else $FALSE"
      - pattern-not-inside: "[$VALUE for $ITEM in $ITERABLE if <... frappe.has_permission(...) ...>]"
      - pattern-not-inside: "{$VALUE for $ITEM in $ITERABLE if <... frappe.has_permission(...) ...>}"
      - pattern-not-inside: "($VALUE for $ITEM in $ITERABLE if <... frappe.has_permission(...) ...>)"
      - pattern-not-inside: "{$KEY: $VALUE for $ITEM in $ITERABLE if <... frappe.has_permission(...) ...>}"
      - pattern-not-inside: "$CONSUMER(..., <... frappe.has_permission(...) ...>, ...)"
      - pattern-not-inside: "while <... frappe.has_permission(...) ...>: ..."
      - pattern-not-inside: "$CONSUMER(..., $KEY=<... frappe.has_permission(...) ...>, ...)"
      - pattern-not-inside: "frappe.has_permission(...) or $FALLBACK"
      - pattern-not-inside: "frappe.has_permission(...) and $ACTION"
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"

  - id: frappe-whitelisted-direct-file-path
    languages: [python]
    severity: ERROR
    message: >-
      Whitelisted method $FUNC writes or reads the caller-supplied path $PATH
      directly. Resolve the operation through Frappe's File API or constrain
      the path to an allowed server directory before opening it.
    metadata:
      origin: custom
      category: security
      confidence: HIGH
      technology: [frappe]
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
    mode: taint
    options:
      # Selecting a fixed allowlisted value is not caller-controlled file data.
      taint_assume_safe_indexes: true
    pattern-sources:
      - patterns:
          - pattern-inside: |
              @frappe.whitelist(...)
              def $FUNC(..., $INPUT, ...):
                ...
          - focus-metavariable: $INPUT
    pattern-sanitizers:
      # Only a fixed tuple and a sole terminating statement establish this guard.
      - patterns:
          - pattern: |
              if $PATH not in $ALLOWED:
                frappe.throw(...)
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: >-
                ^\(\s*(?:"[^"\\]*"|'[^'\\]*')\s*(?:,\s*(?:"[^"\\]*"|'[^'\\]*')\s*)*,?\s*\)$
          - pattern-not-inside: |
              try:
                ...
              except ...:
                ...
          - focus-metavariable: $PATH
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              @frappe.whitelist(...)
              def $FUNC(...):
                ...
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: open(..., file=$PATH, ...)
          - focus-metavariable: $PATH
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"

  - id: frappe-interpolated-execute-in-shell
    languages: [python]
    severity: WARNING
    message: >-
      An interpolated string is passed to Frappe's explicit shell helper.
      Prefer an argv-based subprocess call; otherwise quote every interpolated
      value and verify its trust boundary. This match does not prove attacker
      control.
    metadata:
      origin: custom
      category: security
      confidence: HIGH
      technology: [frappe]
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
    mode: taint
    options:
      # Resolve simple quoted-variable assignments in the concatenation exclusions.
      symbolic_propagation: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: f"...{$VALUE}..."
              - pattern: $TEMPLATE.format(..., $VALUE, ...)
              - pattern: $TEMPLATE.format(..., $KEY=$VALUE, ...)
              - pattern: '"..." % $VALUE'
              - pattern: '"..." + $VALUE'
              - pattern: '$VALUE + "..."'
              - pattern: '"..." % (..., $VALUE, ...)'
          - pattern-not: '"..." + shlex.quote(...)'
          - pattern-not: '"..." + shlex.join(...)'
          - focus-metavariable: $VALUE
          - metavariable-pattern:
              metavariable: $VALUE
              patterns:
                - pattern-not: '"..."'
                - pattern-not: '(...,)'
                - pattern-not: shlex.quote(...)
                - pattern-not: shlex.join(...)
          - pattern-not-inside: shlex.quote(...)
          - pattern-not-inside: shlex.join(...)
        exact: true
      - patterns:
          - pattern: $SEPARATOR.join(...)
          - pattern-not: shlex.join(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
      - pattern: shlex.join(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: frappe.utils.execute_in_shell($COMMAND, ...)
              - pattern: execute_in_shell($COMMAND, ...)
              - pattern: frappe.utils.execute_in_shell(..., cmd=$COMMAND, ...)
              - pattern: execute_in_shell(..., cmd=$COMMAND, ...)
          - focus-metavariable: $COMMAND
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"

  - id: frappe-whitelisted-permission-bypass
    languages: [python]
    severity: WARNING
    message: >-
      Whitelisted method $FUNC bypasses DocType permissions. Verify caller and
      record-level authorisation before this operation; authentication alone is
      not sufficient. Keep the bypass internal when remote access is not needed.
    metadata:
      origin: custom
      category: security
      confidence: MEDIUM
      technology: [frappe]
      cwe:
        - "CWE-862: Missing Authorization"
      references:
        - https://docs.frappe.io/framework/user/en/api/database#frappedbget_list
    patterns:
      - pattern-either:
          - pattern-inside: |
              @frappe.whitelist(...)
              def $FUNC(...):
                ...
          - pattern-inside: |
              @frappe.whitelist(...)
              async def $FUNC(...):
                ...
      - pattern-not-inside: |
          frappe.only_for(...)
          ...
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: frappe.get_all($DT, ...)
                  - pattern: frappe.get_all(..., doctype=$DT, ...)
                  - pattern: frappe.db.get_all($DT, ...)
                  - pattern: frappe.db.get_all(..., doctype=$DT, ...)
                  - pattern: frappe.get_list($DT, ..., ignore_permissions=True, ...)
                  - pattern: frappe.get_list(..., doctype=$DT, ..., ignore_permissions=True, ...)
                  - pattern: frappe.get_list($DT, ..., ignore_permissions=1, ...)
                  - pattern: frappe.get_list(..., doctype=$DT, ..., ignore_permissions=1, ...)
                  - pattern: frappe.db.get_list($DT, ..., ignore_permissions=True, ...)
                  - pattern: frappe.db.get_list(..., doctype=$DT, ..., ignore_permissions=True, ...)
                  - pattern: frappe.db.get_list($DT, ..., ignore_permissions=1, ...)
                  - pattern: frappe.db.get_list(..., doctype=$DT, ..., ignore_permissions=1, ...)
                  - pattern: frappe.delete_doc($DT, ..., ignore_permissions=True, ...)
                  - pattern: frappe.delete_doc(..., doctype=$DT, ..., ignore_permissions=True, ...)
                  - pattern: frappe.delete_doc($DT, ..., ignore_permissions=1, ...)
                  - pattern: frappe.delete_doc(..., doctype=$DT, ..., ignore_permissions=1, ...)
              - pattern-not-inside: |
                  frappe.has_permission($DT, ..., throw=True, ...)
                  ...
              - pattern-not-inside: |
                  frappe.has_permission(..., doctype=$DT, ..., throw=True, ...)
                  ...
          - patterns:
              - pattern-either:
                  - pattern: $DOC.save(..., ignore_permissions=True, ...)
                  - pattern: $DOC.save(..., ignore_permissions=1, ...)
                  - pattern: $DOC.insert(..., ignore_permissions=True, ...)
                  - pattern: $DOC.insert(..., ignore_permissions=1, ...)
                  - pattern: $DOC.submit(..., ignore_permissions=True, ...)
                  - pattern: $DOC.submit(..., ignore_permissions=1, ...)
                  - pattern: $DOC.cancel(..., ignore_permissions=True, ...)
                  - pattern: $DOC.cancel(..., ignore_permissions=1, ...)
                  - pattern: $DOC.delete(..., ignore_permissions=True, ...)
                  - pattern: $DOC.delete(..., ignore_permissions=1, ...)
                  - pattern: $DOC.flags.ignore_permissions = True
                  - pattern: $DOC.flags.ignore_permissions = 1
              - pattern-not-inside: |
                  $DOC.check_permission(...)
                  ...
              - pattern-not-inside: |
                  frappe.has_permission(..., doc=$DOC, ..., throw=True, ...)
                  ...
              - pattern-not-inside: |
                  frappe.has_permission($DT, $PTYPE, $DOC, ..., throw=True, ...)
                  ...
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"


  - id: frappe-whitelisted-raw-sql
    languages: [python]
    severity: WARNING
    message: >-
      Whitelisted method $FUNC executes raw SQL, which bypasses DocType and
      record permissions. Verify endpoint authorisation and ensure the query
      applies the intended match conditions; parameterisation prevents
      injection but does not enforce access control.
    metadata:
      origin: custom
      category: security
      confidence: MEDIUM
      technology: [frappe]
      cwe:
        - "CWE-862: Missing Authorization"
    patterns:
      - pattern-either:
          - pattern-inside: |
              @frappe.whitelist(...)
              def $FUNC(...):
                ...
          - pattern-inside: |
              @frappe.whitelist(...)
              async def $FUNC(...):
                ...
      - pattern: frappe.db.sql(...)
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"

  - id: frappe-setuser-outside-tests
    languages: [python]
    severity: WARNING
    message: >-
      frappe.set_user switches the session user, so every later permission
      check in this request runs as that user. Verify that no remote caller can
      choose the target user, and restore the previous user in a finally block.
      This is the upstream frappe-setuser check without test code; run it with
      --exclude-rule for the upstream ID to drop test-helper findings.
    metadata:
      origin: custom
      category: security
      confidence: LOW
      technology: [frappe]
      cwe:
        - "CWE-269: Improper Privilege Management"
    pattern: frappe.set_user(...)
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
        - "**/conftest.py"

  - id: frappe-csv-row-without-formula-escape
    languages: [python]
    severity: WARNING
    message: >-
      CSV rows are written without escape_formula_injection. A cell that starts
      with =, +, - or @ is evaluated as a formula when the file is opened in a
      spreadsheet. Escape string cells with
      frappe.utils.csvutils.escape_formula_injection or write through
      frappe.utils.csvutils.UnicodeWriter. Files read back only by code may
      keep raw values if the reader never opens them in a spreadsheet.
    metadata:
      origin: custom
      category: security
      confidence: LOW
      technology: [frappe]
      cwe:
        - "CWE-1236: Improper Neutralization of Formula Elements in a CSV File"
    patterns:
      - pattern-inside: |
          $WRITER = csv.writer(...)
          ...
      - pattern-either:
          - pattern: $WRITER.writerow($ROWS)
          - pattern: $WRITER.writerows($ROWS)
      - pattern-not: $WRITER.writerow(<... escape_formula_injection(...) ...>)
      - pattern-not: $WRITER.writerows(<... escape_formula_injection(...) ...>)
      - pattern-not-inside: |
          $ROWS = <... escape_formula_injection(...) ...>
          ...
      - pattern-not-regex: >-
          \.writerow\(\s*\[\s*(?:(?:"[^"\n]*"|'[^'\n]*'|_\(\s*(?:"[^"\n]*"|'[^'\n]*')\s*\))\s*,?\s*)*\]\s*\)
      - pattern-not-regex: >-
          \b(\w+)\s*=\s*\[\s*(?:(?:"[^"\n]*"|'[^'\n]*'|_\(\s*(?:"[^"\n]*"|'[^'\n]*')\s*\))\s*,?\s*)*\]\s*\n[\s\S]*?\K\b\w+\.writerow\(\s*\1\s*\)
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
