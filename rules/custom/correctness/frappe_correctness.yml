rules:
  - id: frappe-async-array-callback-misuse
    languages: [javascript]
    severity: ERROR
    message: >-
      This array method consumes an async callback's Promise as a synchronous
      predicate or comparator result. Resolve the values before calling the
      array method, or use an explicitly synchronous callback.
    metadata:
      origin: custom
      category: correctness
      confidence: HIGH
      technology: [frappe]
      references:
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/forEach
    # Match callback syntax so comments and whitespace cannot hide async.
    patterns:
      - pattern: $ARRAY.$METHOD($CALLBACK, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(filter|find|some|every|sort)$
      - metavariable-pattern:
          metavariable: $CALLBACK
          pattern-either:
            - pattern: 'async (...) => { ... }'
            - pattern: 'async function (...) { ... }'
            - pattern: 'async function $NAME(...) { ... }'
      # CE 1.174.0 ignores async in syntax matching. Check the captured
      # callback prefix, excluding a synchronous arrow parameter named async.
      - metavariable-regex:
          metavariable: $CALLBACK
          regex: '(?s)^async\b(?!(?:\s|/\*.*?\*/|//[^\r\n]*)*=>)'
    paths:
      exclude:
        - "**/*.test.js"
        - "**/tests/**"

  - id: frappe-async-foreach-callback
    languages: [javascript]
    severity: WARNING
    message: >-
      forEach discards the Promise returned by its async callback. Review
      whether subsequent work depends on callback completion; use for...of or
      Promise.all with map when completion or failure must be observed.
    metadata:
      origin: custom
      category: correctness
      confidence: MEDIUM
      technology: [frappe]
      references:
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/forEach
    patterns:
      - pattern: $ARRAY.forEach($CALLBACK, ...)
      - metavariable-pattern:
          metavariable: $CALLBACK
          pattern-either:
            - pattern: 'async (...) => { ... }'
            - pattern: 'async function (...) { ... }'
            - pattern: 'async function $NAME(...) { ... }'
      # CE 1.174.0 ignores async in syntax matching. Check the captured
      # callback prefix, excluding a synchronous arrow parameter named async.
      - metavariable-regex:
          metavariable: $CALLBACK
          regex: '(?s)^async\b(?!(?:\s|/\*.*?\*/|//[^\r\n]*)*=>)'
    paths:
      exclude:
        - "**/*.test.js"
        - "**/tests/**"

  - id: frappe-malformed-sql-placeholder-list
    languages: [python]
    severity: ERROR
    message: >-
      Multiplying the placeholder string before joining produces adjacent
      placeholders such as %s%s, not a comma-separated list. Multiply the
      one-element placeholder list instead: ", ".join(["%s"] * len(values)).
    metadata:
      origin: custom
      category: correctness
      confidence: HIGH
      technology: [frappe]
    patterns:
      - pattern-either:
          - pattern: '$SEP.join(["%s" * len($VALUES)])'
          - pattern: "$SEP.join(['%s' * len($VALUES)])"
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"

  - id: frappe-gl-entry-read-without-is-cancelled
    languages: [python]
    severity: WARNING
    message: >-
      This GL Entry read filters on docstatus but not on is_cancelled. Cancelling
      a voucher keeps its GL Entries submitted (docstatus 1) and sets
      is_cancelled 1, so the result includes cancelled postings. Add
      "is_cancelled": 0 to the filters.
    metadata:
      origin: custom
      category: correctness
      confidence: MEDIUM
      technology: [frappe, erpnext]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: 'frappe.$GET("GL Entry", ..., filters={..., "docstatus": $D, ...}, ...)'
                  - pattern: 'frappe.db.$GET("GL Entry", ..., filters={..., "docstatus": $D, ...}, ...)'
                  - pattern: 'frappe.$GET("GL Entry", {..., "docstatus": $D, ...}, ...)'
                  - pattern: 'frappe.db.$GET("GL Entry", {..., "docstatus": $D, ...}, ...)'
              - pattern-not: 'frappe.$GET("GL Entry", ..., filters={..., "is_cancelled": $C, ...}, ...)'
              - pattern-not: 'frappe.db.$GET("GL Entry", ..., filters={..., "is_cancelled": $C, ...}, ...)'
              - pattern-not: 'frappe.$GET("GL Entry", {..., "is_cancelled": $C, ...}, ...)'
              - pattern-not: 'frappe.db.$GET("GL Entry", {..., "is_cancelled": $C, ...}, ...)'
          - patterns:
              - pattern-inside: |
                  $FILTERS = {..., "docstatus": $D, ...}
                  ...
              - pattern-not-inside: |
                  $FILTERS = {..., "is_cancelled": $C, ...}
                  ...
              - pattern-not-inside: |
                  $FILTERS["is_cancelled"] = $C
                  ...
              - pattern-not-inside: |
                  $FILTERS.update({..., "is_cancelled": $C, ...})
                  ...
              - pattern-either:
                  - pattern: frappe.$GET("GL Entry", ..., filters=$FILTERS, ...)
                  - pattern: frappe.db.$GET("GL Entry", ..., filters=$FILTERS, ...)
                  - pattern: frappe.$GET("GL Entry", $FILTERS, ...)
                  - pattern: frappe.db.$GET("GL Entry", $FILTERS, ...)
      - metavariable-regex:
          metavariable: $GET
          regex: ^(get_all|get_list)$
    paths:
      exclude:
        - "**/test_*.py"
        - "**/tests/**"
